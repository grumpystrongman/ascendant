name: Assemble Generated Art

on:
  push:
    branches: ["major-game-pass"]
    paths:
      - "art-src/**"
      - ".github/workflows/build-art.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[asset-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: major-game-pass
      - name: Assemble atlas
        run: |
          mkdir -p public/art
          cat art-src/atlas.part* | base64 --decode > public/art/ascendant-atlas.jpg
          test -s public/art/ascendant-atlas.jpg
          file public/art/ascendant-atlas.jpg
          test "$(stat -c%s public/art/ascendant-atlas.jpg)" -gt 40000
      - name: Commit assembled asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/ascendant-atlas.jpg
          git commit -m "art: assemble generated anime atlas [asset-build]"
          git push
